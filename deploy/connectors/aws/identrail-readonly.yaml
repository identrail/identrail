AWSTemplateFormatVersion: '2010-09-09'
Description: Identrail read-only machine identity connector role.

Metadata:
  IdentrailConnector:
    Version: '2.2.0'

Parameters:
  IdentrailAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: AWS account ID for the Identrail deployment that assumes this role.
  ExternalId:
    Type: String
    Default: ''
    NoEcho: true
    AllowedPattern: '^$|^[A-Za-z0-9+=,.@:_-]{16,256}$'
    Description: Troubleshooting-only External ID (16-256 chars when supplied). Automatic setup obtains this securely from Identrail.
  RegistrationProviderArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:(aws|aws-us-gov|aws-cn):sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]{1,256}$'
    Description: Regional Identrail registration provider selected by the app.
  RegistrationAttemptId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9-]{16,128}$'
    Description: Short-lived Identrail onboarding attempt identifier.
  RegistrationToken:
    Type: String
    Default: ''
    # Do not set NoEcho: AWS quick-create ignores URL values for NoEcho
    # parameters. This short-lived, connector-scoped grant is hash-only at
    # rest and cannot access AWS; making it NoEcho would break zero-copy setup.
    AllowedPattern: '^$|^[A-Za-z0-9_-]{32,128}$'
    Description: One-time registration grant. It cannot access AWS and expires after setup.
  RoleName:
    Type: String
    Default: IdentrailReadOnly
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'
    Description: IAM role name to create for Identrail.
  RolloutId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9-]{16,128}$'
    Description: Identrail organization rollout identifier (populated by StackSet parameters for member-account instances).
  RolloutRegistrationSecret:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9_-]{32,256}$'
    Description: Rollout-scoped secret used both as sts:ExternalId and to authenticate the member-account registration event. Never stored in plaintext by Identrail.
  RolloutOrganizationId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^o-[a-z0-9]{10,32}$'
    Description: AWS Organization ID this rollout targets.
  RolloutManagementAccountId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]{12}$'
    Description: Management or delegated-admin account that approved this rollout.
  RolloutStackSetName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9-]{1,128}$'
    Description: StackSet name used to launch this rollout.

Rules:
  RequireAutomaticOrManualTrustGuard:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - Fn::Not:
                    - Fn::Equals:
                        - Ref: RegistrationProviderArn
                        - ''
                - Fn::Not:
                    - Fn::Equals:
                        - Ref: RegistrationAttemptId
                        - ''
                - Fn::Not:
                    - Fn::Equals:
                        - Ref: RegistrationToken
                        - ''
            - Fn::And:
                - Fn::Not:
                    - Fn::Equals:
                        - Ref: RegistrationProviderArn
                        - ''
                - Fn::Not:
                    - Fn::Equals:
                        - Ref: RolloutId
                        - ''
                - Fn::Not:
                    - Fn::Equals:
                        - Ref: RolloutRegistrationSecret
                        - ''
                - Fn::Not:
                    - Fn::Equals:
                        - Ref: RolloutOrganizationId
                        - ''
                - Fn::Not:
                    - Fn::Equals:
                        - Ref: RolloutStackSetName
                        - ''
            - Fn::Not:
                - Fn::Equals:
                    - Ref: ExternalId
                    - ''
            - Fn::Not:
                - Fn::And:
                    - Fn::Not:
                        - Fn::Equals:
                            - Ref: RegistrationAttemptId
                            - ''
                    - Fn::Not:
                        - Fn::Equals:
                            - Ref: RegistrationToken
                            - ''
                    - Fn::Not:
                        - Fn::Equals:
                            - Ref: RolloutId
                            - ''
                    - Fn::Not:
                        - Fn::Equals:
                            - Ref: RolloutRegistrationSecret
                            - ''
        AssertDescription: Automatic single-account registration, an organization rollout, or a troubleshooting External ID is required.

Conditions:
  UseAutomaticRegistration:
    Fn::And:
      - Fn::Not:
          - Fn::Equals:
              - Ref: RegistrationProviderArn
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: RegistrationAttemptId
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: RegistrationToken
              - ''
  UseRolloutRegistration:
    Fn::And:
      - Fn::Not:
          - Fn::Equals:
              - Ref: RegistrationProviderArn
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: RolloutId
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: RolloutRegistrationSecret
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: RolloutOrganizationId
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: RolloutStackSetName
              - ''
      - Fn::Not:
          - Fn::Equals:
              - Ref: RolloutManagementAccountId
              - ''
      - Fn::Equals:
          - Ref: RegistrationAttemptId
          - ''
      - Fn::Equals:
          - Ref: RegistrationToken
          - ''

Resources:
  IdentrailRegistrationBootstrap:
    Type: Custom::IdentrailAWSConnectorBootstrap
    Condition: UseAutomaticRegistration
    Properties:
      ServiceToken:
        Ref: RegistrationProviderArn
      # Set higher than the SQS queue's visibility timeout so a single
      # redelivery can complete before the stack rolls back. CloudFormation
      # allows up to 3600s for custom resource ServiceTimeout.
      ServiceTimeout: '3600'
      Phase: Bootstrap
      AttemptId:
        Ref: RegistrationAttemptId
      RegistrationToken:
        Ref: RegistrationToken
      TemplateVersion: '2.2.0'

  IdentrailReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: RoleName
      Description: Read-only role used by Identrail to build machine identity trust graphs.
      Tags:
        - Key: IdentrailConnectorMode
          Value:
            Fn::If:
              - UseAutomaticRegistration
              - automatic
              - Fn::If:
                  - UseRolloutRegistration
                  - automatic
                  - manual
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${IdentrailAccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Fn::If:
                    - UseRolloutRegistration
                    - Ref: RolloutRegistrationSecret
                    - Fn::If:
                        - UseAutomaticRegistration
                        - Fn::GetAtt:
                            - IdentrailRegistrationBootstrap
                            - ExternalId
                        - Ref: ExternalId
      Policies:
        - PolicyName: IdentrailReadOnlyCollector
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: IdentityTrustGraphReadOnlyIAM
                Effect: Allow
                Action:
                  - iam:GetAccountSummary
                  - iam:GetInstanceProfile
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAccountAliases
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:ListRoles
                  - iam:SimulatePrincipalPolicy
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyCompute
                Effect: Allow
                Action:
                  - ec2:DescribeIamInstanceProfileAssociations
                  - ec2:DescribeInstances
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeRegions
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyECS
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:ListTaskDefinitions
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyCodeBuild
                Effect: Allow
                Action:
                  - codebuild:BatchGetProjects
                  - codebuild:ListProjects
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyLambda
                Effect: Allow
                Action:
                  - lambda:ListFunctions
                  - lambda:ListEventSourceMappings
                  - lambda:ListAliases
                  - lambda:ListVersionsByFunction
                  - lambda:ListTags
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyCodePipeline
                Effect: Allow
                Action:
                  - codepipeline:ListPipelines
                  - codepipeline:GetPipeline
                  - codepipeline:GetPipelineState
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyStepFunctions
                Effect: Allow
                Action:
                  - states:ListStateMachines
                  - states:DescribeStateMachine
                  - states:ListTagsForResource
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyEventDriven
                Effect: Allow
                Action:
                  - events:ListEventBuses
                  - events:ListRules
                  - events:ListTargetsByRule
                  - events:ListTagsForResource
                  - scheduler:ListSchedules
                  - scheduler:GetSchedule
                  - pipes:ListPipes
                  - pipes:DescribePipe
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyManagedCompute
                Effect: Allow
                Action:
                  - apprunner:ListServices
                  - apprunner:DescribeService
                  - batch:DescribeComputeEnvironments
                  - batch:DescribeJobDefinitions
                  - glue:GetJobs
                  - glue:GetCrawlers
                  - elasticmapreduce:ListClusters
                  - elasticmapreduce:DescribeCluster
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyEKS
                Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:DescribeFargateProfile
                  - eks:DescribeNodegroup
                  - eks:DescribePodIdentityAssociation
                  - eks:ListClusters
                  - eks:ListFargateProfiles
                  - eks:ListNodegroups
                  - eks:ListPodIdentityAssociations
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlySageMaker
                Effect: Allow
                Action:
                  - sagemaker:DescribeDomain
                  - sagemaker:DescribeEndpoint
                  - sagemaker:DescribeEndpointConfig
                  - sagemaker:DescribeModel
                  - sagemaker:DescribeNotebookInstance
                  - sagemaker:DescribePipeline
                  - sagemaker:DescribeProcessingJob
                  - sagemaker:DescribeTrainingJob
                  - sagemaker:DescribeTransformJob
                  - sagemaker:ListDomains
                  - sagemaker:ListEndpoints
                  - sagemaker:ListModels
                  - sagemaker:ListNotebookInstances
                  - sagemaker:ListPipelines
                  - sagemaker:ListProcessingJobs
                  - sagemaker:ListTrainingJobs
                  - sagemaker:ListTransformJobs
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyStorage
                Effect: Allow
                Action:
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:GetEncryptionConfiguration
                  - s3:ListAccessPoints
                  - s3:ListAllMyBuckets
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyECR
                Effect: Allow
                Action:
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetLifecyclePolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:GetRegistryScanningConfiguration
                  - ecr:ListTagsForResource
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyKMS
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                  - kms:ListAliases
                  - kms:ListGrants
                  - kms:ListKeys
                  - kms:ListResourceTags
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyMessaging
                Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                  - sqs:ListQueues
                  - sqs:ListQueueTags
                  - sns:GetSubscriptionAttributes
                  - sns:GetTopicAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:ListTagsForResource
                  - sns:ListTopics
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyDynamoDBRDS
                Effect: Allow
                Action:
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - dynamodb:ListTagsOfResource
                  - dynamodb:GetResourcePolicy
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                  - rds:DescribeDBProxies
                  - rds:ListTagsForResource
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlySecretsManager
                Effect: Allow
                Action:
                  - secretsmanager:ListSecrets
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:ListSecretVersionIds
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlySSM
                Effect: Allow
                Action:
                  - ssm:DescribeParameters
                  - ssm:ListTagsForResource
                Resource: '*'
              - Sid: IdentityTrustGraphReadOnlyAgentCore
                Effect: Allow
                Action:
                  - bedrock-agentcore:ListAgentRuntimes
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:ListAgentRuntimeEndpoints
                  - bedrock-agentcore:ListGateways
                  - bedrock-agentcore:GetGateway
                  - bedrock-agentcore:ListGatewayTargets
                  - bedrock-agentcore:GetGatewayTarget
                  - bedrock-agentcore:ListMemories
                  - bedrock-agentcore:GetMemory
                  - bedrock-agentcore:ListBrowsers
                  - bedrock-agentcore:GetBrowser
                  - bedrock-agentcore:ListCodeInterpreters
                  - bedrock-agentcore:GetCodeInterpreter
                Resource: '*'
              - Sid: IdentityTrustGraphCallerIdentity
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
              - Sid: OrganizationRolloutInventory
                Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:ListAccountsForParent
                  - organizations:ListDelegatedAdministrators
                  - organizations:ListDelegatedServicesForAccount
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListRoots
                  - cloudformation:ListStackInstances
                Resource: '*'

  IdentrailConnectorRegistration:
    Type: Custom::IdentrailAWSConnectorRegistration
    Condition: UseAutomaticRegistration
    DependsOn:
      - IdentrailReadOnlyRole
    Properties:
      ServiceToken:
        Ref: RegistrationProviderArn
      # Set higher than the SQS queue's visibility timeout so a single
      # redelivery can complete before the stack rolls back. CloudFormation
      # allows up to 3600s for custom resource ServiceTimeout.
      ServiceTimeout: '3600'
      Phase: Register
      AttemptId:
        Ref: RegistrationAttemptId
      ExternalId:
        Fn::GetAtt:
          - IdentrailRegistrationBootstrap
          - ExternalId
      RoleArn:
        Fn::GetAtt:
          - IdentrailReadOnlyRole
          - Arn
      TemplateVersion: '2.2.0'

  IdentrailRolloutRegistration:
    Type: Custom::IdentrailAWSConnectorRegistration
    Condition: UseRolloutRegistration
    DependsOn:
      - IdentrailReadOnlyRole
    Properties:
      ServiceToken:
        Ref: RegistrationProviderArn
      # Match single-account bounds so a single SQS redelivery has time to
      # complete before the member-account stack rolls back.
      ServiceTimeout: '3600'
      Phase: Register
      RolloutId:
        Ref: RolloutId
      RegistrationSecret:
        Ref: RolloutRegistrationSecret
      OrganizationId:
        Ref: RolloutOrganizationId
      ManagementAccountId:
        Ref: RolloutManagementAccountId
      StackSetName:
        Ref: RolloutStackSetName
      RoleArn:
        Fn::GetAtt:
          - IdentrailReadOnlyRole
          - Arn
      TemplateVersion: '2.2.0'

Outputs:
  RoleArn:
    Description: Read-only connector role registered automatically with Identrail.
    Value:
      Fn::GetAtt:
        - IdentrailReadOnlyRole
        - Arn
  ExternalIdConfigured:
    Description: Confirms the External ID condition was configured.
    Value: true
  RegistrationMode:
    Description: Reports whether the stack used automatic, rollout, or troubleshooting setup.
    Value:
      Fn::If:
        - UseRolloutRegistration
        - rollout
        - Fn::If:
            - UseAutomaticRegistration
            - automatic
            - troubleshooting
