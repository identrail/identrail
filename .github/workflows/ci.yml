name: CI

on:
  pull_request:
    branches: ["dev"]
  push:
    branches: ["dev"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go Modules
        run: go mod download

      - name: Enforce gofmt
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files '*.go' | grep -q .; then
            exit 0
          fi
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "${unformatted}" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: go-quality
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Unit and Package Tests
        run: go test ./... -coverprofile=coverage.out

      - name: Enforce Coverage Threshold
        shell: bash
        run: |
          set -euo pipefail
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')"
          echo "Total coverage: ${total}%"
          awk -v total="${total}" 'BEGIN { if ((total + 0) < 80.0) { printf("coverage %.1f%% is below 80%%\n", total); exit 1 } }'

  go-integration:
    name: Go Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: go-quality
    env:
      CI_POSTGRES_PASSWORD: ci-pg-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identrail
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: identrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identrail -d identrail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Integration Tests
        env:
          IDENTRAIL_INTEGRATION_DATABASE_URL: postgres://identrail:${{ env.CI_POSTGRES_PASSWORD }}@127.0.0.1:5432/identrail?sslmode=disable
        run: go test -tags=integration ./internal/integration -count=1 -v

  go-cli-smoke:
    name: CLI Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: go-quality
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: CLI Scan Smoke (Table + JSON)
        shell: bash
        run: |
          set -euo pipefail
          state_file="/tmp/identrail-smoke-state.json"
          go run ./cmd/cli --state-file "${state_file}" scan \
            --fixture testdata/aws/role_with_policies.json \
            --fixture testdata/aws/role_with_urlencoded_trust.json \
            --output table
          go run ./cmd/cli --state-file "${state_file}" findings --output json > /tmp/identrail-findings.json
          grep -q '"findings"' /tmp/identrail-findings.json

      - name: CLI Repo Scan Smoke
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/cli repo-scan --repo . --history-limit 20 --max-findings 50 --output json > /tmp/identrail-repo-scan.json

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate API Example Contract
        run: ./scripts/check_api_example_contract.sh

      - name: Validate Web Route Integrity
        run: ./scripts/check_web_route_integrity.sh

      - name: Install Web Dependencies
        run: npm ci --prefix web

      - name: Run Web Tests
        run: npm run test:ci --prefix web

      - name: Build Web
        run: npm run build --prefix web

  infra-validate:
    name: Infra Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Helm Lint
        run: helm lint deploy/helm/identrail

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e

      - name: Terraform Format Check
        run: terraform fmt -check -recursive deploy/terraform deploy/aws/terraform

      - name: Terraform Validate
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/terraform
          terraform init -backend=false
          terraform validate
          cd ../aws/terraform
          terraform init -backend=false
          terraform validate

  deploy-portability:
    name: Deploy Portability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate only on the fast Go linter so the image builds start in parallel with
    # the test/integration jobs instead of waiting for all of them to finish.
    needs: [go-quality]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Restore Build Caches
        id: portability-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .ci-cache/go-build
            .ci-cache/go-mod
            .ci-cache/npm
          key: deploy-portability-${{ runner.os }}-${{ hashFiles('go.sum', 'web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            deploy-portability-${{ runner.os }}-${{ hashFiles('go.sum', 'web/package-lock.json') }}-
            deploy-portability-${{ runner.os }}-

      - name: Hydrate BuildKit Cache Mounts
        # Round-trips the Go module/compiler and npm caches into the BuildKit
        # cache mounts (the gha layer cache does not persist cache mounts), so a
        # source change only recompiles the affected packages instead of the whole
        # dependency tree on every run.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              ".ci-cache/go-build": "/root/.cache/go-build",
              ".ci-cache/go-mod": "/go/pkg/mod",
              ".ci-cache/npm": "/root/.npm"
            }
          skip-extraction: ${{ steps.portability-cache.outputs.cache-hit }}

      - name: Validate Docker Compose Config
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/docker/.env.example deploy/docker/.env
          docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env config > /tmp/identrail-compose.yml

      - name: Build API Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          build-args: |
            TARGET=server
          tags: identrail/api:ci
          load: true
          cache-from: type=gha,scope=deploy-portability-backend
          cache-to: type=gha,mode=max,scope=deploy-portability-backend,ignore-error=true

      - name: Build Worker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          build-args: |
            TARGET=worker
          tags: identrail/worker:ci
          load: true
          cache-from: type=gha,scope=deploy-portability-backend
          cache-to: type=gha,mode=max,scope=deploy-portability-backend,ignore-error=true

      - name: Verify Worker Repo Scan Runtime
        run: docker run --rm --entrypoint /usr/bin/git identrail/worker:ci --version

      - name: Build Web Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          build-args: |
            VITE_IDENTRAIL_API_URL=http://localhost:8080
          tags: identrail/web:ci
          load: true
          cache-from: type=gha,scope=deploy-portability-web
          cache-to: type=gha,mode=max,scope=deploy-portability-web,ignore-error=true

      - name: Compose API Smoke (Postgres + API)
        shell: bash
        run: |
          set -euo pipefail
          read_key="$(openssl rand -hex 24)"
          write_key="$(openssl rand -hex 24)"
          pg_password="$(openssl rand -hex 24)"
          cat > deploy/docker/.env <<EOF
          IDENTRAIL_SERVICE_NAME=identrail
          IDENTRAIL_LOG_LEVEL=info
          IDENTRAIL_PROVIDER=aws
          IDENTRAIL_AWS_SOURCE=fixture
          IDENTRAIL_AWS_REGION=us-east-1
          IDENTRAIL_AWS_FIXTURES=/app/testdata/aws/role_with_policies.json,/app/testdata/aws/role_with_urlencoded_trust.json
          IDENTRAIL_K8S_SOURCE=fixture
          IDENTRAIL_K8S_FIXTURES=/app/testdata/kubernetes/service_account_payments.json,/app/testdata/kubernetes/cluster_role_cluster_admin.json,/app/testdata/kubernetes/role_binding_cluster_admin.json,/app/testdata/kubernetes/pod_payments.json
          IDENTRAIL_API_KEYS=${read_key},${write_key}
          IDENTRAIL_WRITE_API_KEYS=${write_key}
          IDENTRAIL_POSTGRES_PASSWORD=${pg_password}
          IDENTRAIL_RATE_LIMIT_RPM=10000
          IDENTRAIL_RATE_LIMIT_BURST=1000
          IDENTRAIL_LOCK_BACKEND=auto
          IDENTRAIL_LOCK_NAMESPACE=identrail-ci
          IDENTRAIL_REPO_SCAN_ENABLED=false
          IDENTRAIL_AUDIT_LOG_FILE=
          IDENTRAIL_SCAN_INTERVAL=15m
          IDENTRAIL_WORKER_RUN_NOW=false
          VITE_IDENTRAIL_API_URL=http://localhost:8080
          EOF

          docker tag identrail/api:ci identrail/api:local
          docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env up -d postgres api

          healthy=false
          for _attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "${healthy}" != "true" ]; then
            echo "API failed health check; dumping container diagnostics"
            docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env ps
            docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env logs api postgres || true
            exit 1
          fi
          curl -fsS http://localhost:8080/healthz

          curl -fsS -X POST http://localhost:8080/v1/scans \
            -H "X-API-Key: ${write_key}" \
            -H 'Content-Type: application/json' \
            > /tmp/identrail-scan-run.json

          curl -fsS http://localhost:8080/v1/findings?limit=5 \
            -H "X-API-Key: ${read_key}" \
            > /tmp/identrail-findings-smoke.json
          grep -q '"items"' /tmp/identrail-findings-smoke.json

      - name: Compose Teardown
        if: always()
        shell: bash
        run: |
          docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env down -v --remove-orphans || true
