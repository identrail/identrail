name: OSV Scanner

on:
  push:
    branches:
      - dev
  schedule:
    - cron: '31 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-default:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      scan-args: |-
        --recursive
        .
