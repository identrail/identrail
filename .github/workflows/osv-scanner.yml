name: OSV Scanner

on:
  push:
    branches:
      - dev
  schedule:
    - cron: '31 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-default:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67
    with:
      scan-args: |-
        --recursive
        .
