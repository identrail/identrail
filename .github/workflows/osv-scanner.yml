name: OSV Scanner

on:
  push:
    branches:
      - dev
  schedule:
    - cron: '31 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-default:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1
    with:
      scan-args: |-
        --recursive
        .
