name: Vercel Production Deploy

on:
  pull_request_target:
    branches:
      - dev
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vercel-production-deploy-${{ github.event_name != 'workflow_dispatch' && github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel Production
    if: github.repository == 'identrail/identrail' && (github.event_name != 'workflow_dispatch' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Production deploys run on the merged base branch, not on the PR
          # head, so check out the base ref explicitly. checkout@v7 rejects
          # the default merge-commit checkout for fork PRs on
          # pull_request_target unless allow-unsafe-pr-checkout is set, which
          # would otherwise break production deploys for accepted fork PRs.
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - name: Gate deployment by PR approval
        id: deploy-gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch; no PR approval gate required."
            exit 0
          fi

          if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Pull request was not merged; skipping production deploy."
            exit 0
          fi

          pr_json="$(gh api repos/"${{ github.repository_owner }}"/"${{ github.event.repository.name }}"/pulls/"${{ github.event.pull_request.number }}")"
          is_draft="$(jq -r '.draft // false' <<< "${pr_json}")"
          if [ "${is_draft}" = "true" ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Pull request is a draft; skipping production deploy."
            exit 0
          fi

          head_sha="$(jq -r '.head.sha // empty' <<< "${pr_json}")"
          if [ -z "${head_sha}" ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Unable to read pull request head SHA; skipping production deploy."
            exit 0
          fi

          # Review state must come from GraphQL: reviewDecision is not on the
          # REST pull request payload, and latestReviews returns one record per
          # reviewer (latest state) so a "changes requested" later upgraded to
          # "approved" on the same commit no longer permanently blocks the
          # deploy. This single query also avoids the multi-page jq breakage
          # that --paginate without --slurp causes when a PR has >100 reviews.
          review_state_json="$(gh api graphql \
            -F owner="${{ github.repository_owner }}" \
            -F name="${{ github.event.repository.name }}" \
            -F number="${{ github.event.pull_request.number }}" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewDecision
                  latestReviews(first: 100) {
                    nodes {
                      state
                      authorAssociation
                      commit { oid }
                    }
                  }
                  reviews(first: 100, states: APPROVED) {
                    nodes {
                      state
                      authorAssociation
                      author { login }
                      commit { oid }
                    }
                  }
                }
              }
            }')"

          review_decision="$(jq -r '.data.repository.pullRequest.reviewDecision // empty' <<< "${review_state_json}")"
          if [ "${review_decision}" = "REVIEW_REQUIRED" ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Pull request is review required; skipping production deploy."
            exit 0
          fi
          if [ "${review_decision}" = "CHANGES_REQUESTED" ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Pull request has unresolved change requests; skipping production deploy."
            exit 0
          fi

          latest_reviews="$(jq -c '.data.repository.pullRequest.latestReviews.nodes' <<< "${review_state_json}")"
          review_approvals="$(jq -c '.data.repository.pullRequest.reviews.nodes' <<< "${review_state_json}")"

          approved_on_head="$(jq -r --arg head_sha "${head_sha}" '[ .[] | select(.state == "APPROVED" and .commit.oid == $head_sha and (.authorAssociation == "MEMBER" or .authorAssociation == "OWNER" or .authorAssociation == "COLLABORATOR")) ] | length' <<< "${latest_reviews}")"
          trusted_approved_on_head="$(jq -r --arg head_sha "${head_sha}" '[ .[] | select((.state == "APPROVED" and .commit.oid == $head_sha and (.authorAssociation == "MEMBER" or .authorAssociation == "OWNER" or .authorAssociation == "COLLABORATOR") and ((.author.login // "") != ""))) | .author.login ] | sort | unique | length' <<< "${review_approvals}")"
          if [ "${approved_on_head}" -lt 1 ] && [ "${trusted_approved_on_head}" -lt 1 ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No trusted approval for the merged commit ${head_sha} was found; skipping production deploy."
            exit 0
          fi
          # Apply the same trusted-author filter to CHANGES_REQUESTED so a
          # non-trusted reviewer cannot permanently block production deploys.
          requested_changes_on_head="$(jq -r --arg head_sha "${head_sha}" '[ .[] | select(.state == "CHANGES_REQUESTED" and .commit.oid == $head_sha and (.authorAssociation == "MEMBER" or .authorAssociation == "OWNER" or .authorAssociation == "COLLABORATOR")) ] | length' <<< "${latest_reviews}")"
          if [ "${requested_changes_on_head}" -gt 0 ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "A trusted reviewer has an unresolved change request on the merged commit ${head_sha}; skipping production deploy."
            exit 0
          fi

          echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          echo "PR #${{ github.event.pull_request.number }} is approved; continuing deploy."

      - name: Validate required Vercel identifiers
        if: steps.deploy-gate.outputs.can_deploy == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing Vercel identifiers. Set VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets."
            exit 1
          fi

      - name: Normalize Vercel token secret
        id: normalize-token
        if: steps.deploy-gate.outputs.can_deploy == 'true'
        env:
          RAW_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n' | sed -e 's/^"//' -e 's/"$//')"
          if [ -z "$token" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$token"
          {
            echo "has_token=true"
            echo "token=$token"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Vercel token
        id: verify-token
        if: steps.deploy-gate.outputs.can_deploy == 'true' && steps.normalize-token.outputs.has_token == 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ steps.normalize-token.outputs.token }}
        run: |
          set -euo pipefail
          if curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user > /tmp/vercel-user.json; then
            echo "token_verified=true" >> "$GITHUB_OUTPUT"
            echo "Token verified for Vercel user:"
            jq -r '.user.username // .username // "unknown"' /tmp/vercel-user.json
          else
            echo "token_verified=false" >> "$GITHUB_OUTPUT"
            echo "Token verification failed; continuing with hook fallback."
          fi

      - name: Prune stale queued deployments
        if: steps.deploy-gate.outputs.can_deploy == 'true' && steps.normalize-token.outputs.has_token == 'true' && steps.verify-token.outputs.token_verified == 'true'
        continue-on-error: true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ steps.normalize-token.outputs.token }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          KEEP_QUEUED_PER_REF: "1"
        run: |
          ./scripts/vercel_cleanup_queued_deployments.sh

      - name: Check VITE_IDENTRAIL_API_URL variable
        id: check-api-url
        if: steps.deploy-gate.outputs.can_deploy == 'true' && steps.normalize-token.outputs.has_token == 'true'
        env:
          VITE_IDENTRAIL_API_URL: ${{ vars.VITE_IDENTRAIL_API_URL }}
          IDENTRAIL_CLOUD_API_URL: https://api.identrail.com
          IDENTRAIL_WEB_ORIGINS: https://identrail.com,https://www.identrail.com,https://app.identrail.com
        run: |
          set -euo pipefail
          api_url="$(printf '%s' "${VITE_IDENTRAIL_API_URL:-${IDENTRAIL_CLOUD_API_URL}}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "${VITE_IDENTRAIL_API_URL}" ]; then
            echo "vars.VITE_IDENTRAIL_API_URL is not set; using Identrail Cloud default ${IDENTRAIL_CLOUD_API_URL}."
          fi
          ./scripts/check_public_api_url.sh "${api_url}"
          {
            echo "api_url=${api_url}"
            echo "has_api_url=true"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert Vercel production web env
        if: steps.deploy-gate.outputs.can_deploy == 'true' && steps.normalize-token.outputs.has_token == 'true' && steps.check-api-url.outputs.has_api_url == 'true'
        env:
          VERCEL_TOKEN: ${{ steps.normalize-token.outputs.token }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_IDENTRAIL_API_URL: ${{ steps.check-api-url.outputs.api_url }}
          VITE_FEATURE_ONBOARDING_WIZARD: ${{ vars.VITE_FEATURE_ONBOARDING_WIZARD || 'true' }}
          VITE_FEATURE_CONNECTOR_AWS: ${{ vars.VITE_FEATURE_CONNECTOR_AWS || 'false' }}
          VITE_FEATURE_CONNECTOR_GITHUB_V2: ${{ vars.VITE_FEATURE_CONNECTOR_GITHUB_V2 || 'false' }}
          VITE_FEATURE_CONNECTOR_K8S: ${{ vars.VITE_FEATURE_CONNECTOR_K8S || 'false' }}
        run: |
          set -euo pipefail

          normalize_bool_flag() {
            local key="$1"
            local value="$2"
            local normalized

            normalized="$(printf '%s' "${value}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "${normalized}" in
              true|false)
                printf '%s' "${normalized}"
                ;;
              *)
                echo "${key} must be true or false; got ${normalized}." >&2
                exit 1
                ;;
            esac
          }

          onboarding_flag="$(normalize_bool_flag "VITE_FEATURE_ONBOARDING_WIZARD" "${VITE_FEATURE_ONBOARDING_WIZARD}")"
          connector_aws_flag="$(normalize_bool_flag "VITE_FEATURE_CONNECTOR_AWS" "${VITE_FEATURE_CONNECTOR_AWS}")"
          connector_github_flag="$(normalize_bool_flag "VITE_FEATURE_CONNECTOR_GITHUB_V2" "${VITE_FEATURE_CONNECTOR_GITHUB_V2}")"
          connector_k8s_flag="$(normalize_bool_flag "VITE_FEATURE_CONNECTOR_K8S" "${VITE_FEATURE_CONNECTOR_K8S}")"

          upsert_env() {
            local key="$1"
            local value="$2"
            local comment="$3"

            payload="$(jq -n \
              --arg key "${key}" \
              --arg value "${value}" \
              --arg comment "${comment}" \
              '{
                key: $key,
                value: $value,
                type: "plain",
                target: ["production", "preview"],
                comment: $comment
              }')"

            curl -fsS -X POST \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${payload}" \
              > "/tmp/vercel-env-upsert-${key}.json"
            jq -r '.created.key // "Vercel env upserted."' "/tmp/vercel-env-upsert-${key}.json"
          }

          upsert_env \
            "VITE_IDENTRAIL_API_URL" \
            "${VITE_IDENTRAIL_API_URL}" \
            "Identrail web -> API base URL (required for production builds)"
          upsert_env \
            "VITE_FEATURE_ONBOARDING_WIZARD" \
            "${onboarding_flag}" \
            "Enable self-serve onboarding for Identrail Cloud production builds"
          upsert_env \
            "VITE_FEATURE_CONNECTOR_AWS" \
            "${connector_aws_flag}" \
            "Enable the AWS connector UI for Identrail Cloud production builds"
          upsert_env \
            "VITE_FEATURE_CONNECTOR_GITHUB_V2" \
            "${connector_github_flag}" \
            "Enable the GitHub connector UI for Identrail Cloud production builds"
          upsert_env \
            "VITE_FEATURE_CONNECTOR_K8S" \
            "${connector_k8s_flag}" \
            "Enable the Kubernetes connector UI for Identrail Cloud production builds"

      - name: Deploy to Vercel
        id: deploy-action
        if: steps.deploy-gate.outputs.can_deploy == 'true' && steps.normalize-token.outputs.has_token == 'true'
        continue-on-error: true
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: false
          vercel-token: ${{ steps.normalize-token.outputs.token }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          experimental-api: true
          target: production
          force: true
          root-directory: web

      - name: Fallback deploy via hook
        id: deploy-hook
        if: steps.deploy-gate.outputs.can_deploy == 'true' && (steps.normalize-token.outputs.has_token != 'true' || steps.deploy-action.outcome != 'success') && env.VERCEL_DEPLOY_HOOK_URL != ''
        run: |
          set -euo pipefail
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" > /tmp/vercel-hook-response.json
          echo "Triggered Vercel deploy hook successfully."

      - name: Fail if no deployment path succeeded
        if: steps.deploy-gate.outputs.can_deploy == 'true' && steps.deploy-action.outcome != 'success' && steps.deploy-hook.outcome != 'success'
        run: |
          echo "Vercel deployment failed."
          echo "Root cause is usually an invalid/stale VERCEL_TOKEN."
          echo "Fix by rotating VERCEL_TOKEN, or set VERCEL_DEPLOY_HOOK_URL for hook-based fallback."
          exit 1
