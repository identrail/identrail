version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - deps/go
    groups:
      go-version-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - deps/npm
    ignore:
      # Vercel performs a post-build TypeScript pass. Major compiler upgrades
      # must be validated in a dedicated preview before this pin is changed.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - deps/github-actions
    groups:
      gha-version-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - deps/docker
    groups:
      docker-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
