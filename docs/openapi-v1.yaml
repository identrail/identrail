        - in: query
          name: severity
          schema:
            type: string
            enum: [critical, high, medium, low]
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: AWS limited enforcement pilot contract
          content:
            application/json:
              schema:
                type: object
                properties:
                  limited_enforcement_pilot:
                    $ref: "#/components/schemas/AWSLimitedEnforcementPilotResult"
        "400":
