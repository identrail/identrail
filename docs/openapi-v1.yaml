          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/repo-risk-graph:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
    get:
      tags: [RepositoryExposure]
      summary: Build a repository machine-identity risk graph
      operationId: getRepoRiskGraph
      parameters:
        - in: query
          name: repo_scan_id
          schema: { type: string }
        - in: query
          name: repository
          schema: { type: string }
        - in: query
          name: default_branch
          schema: { type: string }
        - in: query
          name: severity
          schema:
            $ref: "#/components/schemas/FindingSeverity"
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/FindingType"
      responses:
        "200":
          description: Repository risk graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoRiskGraph"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: identrail_session
    GitHubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: GitHub HMAC SHA-256 signature of the raw webhook request body.
    WorkOSWebhookSignature:
      type: apiKey
      in: header
      name: WorkOS-Signature
      description: WorkOS HMAC SHA-256 signature of the raw webhook request body.
    SCIMBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: per-connection SCIM token
  parameters:
    scopeTenantID:
      in: header
      name: X-Identrail-Tenant-ID
      required: false
      schema:
        type: string
      description: Optional tenant scope override when token claims do not provide tenant context. API key callers must use a key bound to the same tenant scope.
    scopeWorkspaceID:
      in: header
      name: X-Identrail-Workspace-ID
      required: false
      schema:
        type: string
      description: Optional workspace scope override when token claims do not provide workspace context. API key callers must use a key bound to the same workspace scope.
    limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
    cursor:
      in: query
      name: cursor
      schema:
        type: integer
        minimum: 0
    sortBy:
      in: query
      name: sort_by
      schema:
        type: string
      description: Endpoint-specific sort field.
    sortOrder:
      in: query
      name: sort_order
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction.
    githubInstallationID:
      in: header
      name: X-GitHub-Installation-ID
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Optional installation ID fallback when the completion request body omits `installation_id`.
    executiveReportDomain:
      in: query
      name: domain
      schema:
        type: string
        enum:
          - aws
          - github
          - kubernetes
      description: Restrict executive report findings by provider domain (`all` is represented by omitting this query parameter).
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplemented:
      description: Not implemented
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SCIMError:
      description: SCIM error response
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/SCIMError"
  schemas:
    ServiceStatusResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
        service:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_code:
          type: string
          description: Optional stable diagnostic code for clients that can render specific remediation guidance.
        error_detail:
          type: string
          description: Optional sanitized diagnostic detail intended for operator-facing UI.
    SCIMError:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas:
          type: array
          items: { type: string }
        status:
          type: string
        scimType:
          type: string
        detail:
          type: string
    SCIMEmail:
      type: object
      properties:
        value:
          type: string
          format: email
        type:
          type: string
        primary:
          type: boolean
    SCIMMeta:
      type: object
      properties:
        resourceType:
          type: string
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        location:
          type: string
        version:
          type: string
    SCIMUser:
      type: object
      required: [userName, emails]
      properties:
        schemas:
          type: array
          items: { type: string }
        id:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
        userName:
          type: string
        displayName:
          type: string
        active:
          type: boolean
        emails:
          type: array
          items:
            $ref: "#/components/schemas/SCIMEmail"
        groups:
          type: array
          items: { type: string }
        meta:
          $ref: "#/components/schemas/SCIMMeta"
    SCIMUserListResponse:
      type: object
      required: [schemas, totalResults, Resources, startIndex, itemsPerPage]
      properties:
        schemas:
          type: array
          items: { type: string }
        totalResults:
          type: integer
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/SCIMUser"
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
    SCIMPatchRequest:
      type: object
      required: [Operations]
      properties:
        schemas:
          type: array
          items: { type: string }
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [replace]
              path:
                type: string
              value: {}
    CreateInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, admin, analyst, viewer]
    CreateVerifiedDomainRequest:
      type: object
      properties:
        domain:
          type: string
        verification_method:
          type: string
          enum: [dns_txt, manual]
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [owner, admin, analyst, viewer]
        invited_by_user_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    VerifiedDomain:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string }
        domain: { type: string }
        verification_method:
          type: string
          enum: [dns_txt, manual]
        verified_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    IdentityConnection:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string }
        provider:
          type: string
          enum: [workos, oidc, saml]
        type:
          type: string
          enum: [sso, directory_sync]
        workos_connection_id: { type: string }
        entity_id: { type: string }
        sso_url: { type: string, format: uri }
        certificate_pem: { type: string }
        attribute_mapping:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [pending, active, disabled]
        group_role_map:
          type: object
          additionalProperties:
            type: string
        sso_required:
          type: boolean
        jit_provisioning_enabled:
          type: boolean
        has_scim_bearer_token:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NativeSAMLConnection:
      allOf:
        - $ref: "#/components/schemas/IdentityConnection"
    NativeSAMLConnectionRequest:
      type: object
      required: [entity_id, sso_url, certificate_pem, attribute_mapping]
      properties:
        type:
          type: string
          default: sso
        status:
          type: string
          enum: [pending, active, disabled]
        display_name:
          type: string
        entity_id:
          type: string
        sso_url:
          type: string
          format: uri
        certificate_pem:
          type: string
        attribute_mapping:
          type: object
          additionalProperties:
            type: string
          description: Must include the SAML email attribute mapping.
        group_role_map:
          type: object
          additionalProperties:
            type: string
        jit_provisioning_enabled:
          type: boolean
          default: false
        sso_required:
          type: boolean
          default: false
    NativeSAMLConnectionUpdateRequest:
      type: object
      properties:
        type:
          type: string
          default: sso
        status:
          type: string
          enum: [pending, active, disabled]
        display_name:
          type: string
        entity_id:
          type: string
        sso_url:
          type: string
          format: uri
        certificate_pem:
          type: string
        attribute_mapping:
          type: object
          additionalProperties:
            type: string
          description: When present, must include the SAML email attribute mapping.
        group_role_map:
          type: object
          additionalProperties:
            type: string
        jit_provisioning_enabled:
          type: boolean
          default: false
        sso_required:
          type: boolean
          default: false
    NativeSAMLConnectionResponse:
      type: object
      required: [connection]
      properties:
        connection:
          $ref: "#/components/schemas/NativeSAMLConnection"
        scim_bearer_token:
          type: string
          description: One-time plaintext SCIM bearer token returned only on create.
    OnboardingState:
      type: object
      required: [user_id, current_step, connector_skipped, scan_skipped, started_at, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        current_step:
          type: string
          enum: [org, workspace, connect, scan, invite, complete]
        org_id: { type: string }
        workspace_id: { type: string }
        project_id: { type: string }
        connector_id: { type: string }
        connector_type:
          type: string
          enum: [aws, github, kubernetes]
        connector_skipped: { type: boolean }
        scan_skipped: { type: boolean }
        dashboard_tour_dismissed_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OnboardingStateUpdateRequest:
      type: object
      properties:
        current_step:
          type: string
          enum: [org, workspace, connect, scan, invite]
        org_name: { type: string }
        org_slug: { type: string }
        workspace_name: { type: string }
        workspace_slug: { type: string }
        project_name: { type: string }
        project_id: { type: string }
        connector_id: { type: string }
        connector_type:
          type: string
          enum: [aws, github, kubernetes]
        connector_skipped: { type: boolean }
        scan_skipped: { type: boolean }
        dashboard_tour_dismissed: { type: boolean }
    OnboardingStateResponse:
      type: object
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/OnboardingState"
        redirect_path: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        primary_email: { type: string, format: email }
        display_name: { type: string }
        avatar_url: { type: string }
        status:
          type: string
          enum: [active, deactivated, deleted]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
    CurrentUserProfileUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed display name. Control and bidirectional formatting characters are rejected.
        avatar_url:
          type: string
          pattern: '^$|^[Hh][Tt][Tt][Pp][Ss]://([A-Za-z0-9-]+\.)*(avatars\.githubusercontent\.com|githubusercontent\.com|googleusercontent\.com|gravatar\.com|identrail\.com|identrail\.io)(:[0-9]+)?(/.*)?$|^data:image/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/]+={0,2}$'
          description: Blank to clear, an allowed https avatar URL, or a base64 image data URL for PNG, JPEG, WebP, or GIF under 5 MB.
    CurrentUserContext:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        org_id: { type: string }
        workspace_id: { type: string }
        project_id: { type: string }
        role:
          type: string
          enum: [owner, admin, analyst, viewer]
        organization:
          $ref: "#/components/schemas/Organization"
        workspace:
          $ref: "#/components/schemas/Workspace"
        project:
          $ref: "#/components/schemas/Project"
    SessionListItem:
      type: object
      properties:
        id: { type: string }
        ip: { type: string }
        user_agent: { type: string }
        auth_method:
          type: string
          enum: [workos, oidc, manual]
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        current:
          type: boolean
    UserDataExportJob:
      type: object
      required: [id, status, requested_at]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, ready, failed, expired]
        requested_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        download_url:
          type: string
        download_expires_at:
          type: string
          format: date-time
        bundle_size_bytes:
          type: integer
          format: int64
        bundle_sha256:
          type: string
        error_message:
          type: string
    Organization:
      type: object
      properties:
        tenant_id: { type: string }
        display_name: { type: string }
        slug: { type: string }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrganizationUpsertRequest:
      type: object
      required: [display_name, slug]
      properties:
        display_name: { type: string }
        slug: { type: string }
    Workspace:
      type: object
      properties:
        tenant_id: { type: string }
        workspace_id: { type: string }
        display_name: { type: string }
        slug: { type: string }
        status:
          type: string
          enum: [active, suspended, deleted]
        suspended_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceLifecycleResponse:
      type: object
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        status:
          type: string
          enum: [active, suspended, deleted]
        suspended_at:
          type: string
          format: date-time
          nullable: true
    WorkspaceDeletionResponse:
      type: object
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        status:
          type: string
          enum: [deleted]
        deleted_at:
          type: string
          format: date-time
        hard_delete_after:
          type: string
          format: date-time
        grace_period_hours:
          type: integer
    WorkspaceSoleOwnerConflict:
      type: object
      properties:
        error: { type: string }
        code:
          type: string
          enum: [sole_owner_requires_transfer]
        workspace:
          type: object
          properties:
            tenant_id: { type: string }
            workspace_id: { type: string }
            display_name: { type: string }
            slug: { type: string }
        affected_members:
          type: array
          items:
            type: object
            properties:
              member_id: { type: string }
              user_id: { type: string }
              email: { type: string }
              role: { type: string }
    WorkspaceUpsertRequest:
      type: object
      required: [workspace_id, display_name, slug]
      properties:
        workspace_id: { type: string }
        display_name: { type: string }
        slug: { type: string }
    WhoAmIPrincipal:
      type: object
      properties:
        type:
          type: string
          enum: [subject, api_key, anonymous]
        id:
          type: string
    WorkspaceContext:
      type: object
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        member:
          $ref: "#/components/schemas/WorkspaceMember"
        is_active:
          type: boolean
    WhoAmIResponse:
      type: object
      properties:
        principal:
          $ref: "#/components/schemas/WhoAmIPrincipal"
        roles:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        scope:
          type: object
          properties:
            tenant_id:
              type: string
            workspace_id:
              type: string
        active_workspace:
          $ref: "#/components/schemas/WorkspaceContext"
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceContext"
    ActiveWorkspaceSwitchRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
    ActiveWorkspaceSwitchResponse:
      type: object
      properties:
        active_workspace:
          $ref: "#/components/schemas/WorkspaceContext"
        scope:
          type: object
          properties:
            tenant_id:
              type: string
            workspace_id:
              type: string
        scope_headers:
          type: object
          properties:
            X-Identrail-Tenant-ID:
              type: string
            X-Identrail-Workspace-ID:
              type: string
    WorkspaceMemberRole:
      type: string
      enum: [owner, admin, analyst, viewer]
    WorkspaceMemberStatus:
      type: string
      enum: [invited, active, suspended, removed]
    WorkspaceMember:
      type: object
      properties:
        tenant_id: { type: string }
        workspace_id: { type: string }
        member_id: { type: string }
        user_id: { type: string }
        user_uuid:
          type: string
          format: uuid
          nullable: true
        email: { type: string }
        role:
          $ref: "#/components/schemas/WorkspaceMemberRole"
        status:
          $ref: "#/components/schemas/WorkspaceMemberStatus"
        joined_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceMemberUpsertRequest:
      type: object
      required: [member_id, user_id, role]
      properties:
        member_id: { type: string }
        user_id: { type: string }
        email: { type: string }
        role:
          $ref: "#/components/schemas/WorkspaceMemberRole"
        status:
          allOf:
            - $ref: "#/components/schemas/WorkspaceMemberStatus"
          default: invited
          description: Defaults to `invited` when omitted.
    Project:
      type: object
      properties:
        tenant_id: { type: string }
        workspace_id: { type: string }
        project_id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectUpsertRequest:
      type: object
      required: [project_id, name, slug]
      properties:
        project_id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        archived_at:
          type: string
          format: date-time
          nullable: true
    ScanTriggerMode:
      type: string
      enum: [manual, scheduled, event, hybrid]
    ScanPolicy:
      type: object
      properties:
        tenant_id: { type: string }
        workspace_id: { type: string }
        project_id: { type: string }
        policy_id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        trigger_mode:
          $ref: "#/components/schemas/ScanTriggerMode"
        cron: { type: string }
        max_concurrent_scans: { type: integer, minimum: 1 }
        history_limit: { type: integer, minimum: 1 }
        max_findings: { type: integer, minimum: 1 }
        last_scheduled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScanPolicyUpsertRequest:
      type: object
      required: [policy_id, name]
      properties:
        policy_id: { type: string }
        name: { type: string }
        enabled:
          type: boolean
          default: true
        trigger_mode:
          $ref: "#/components/schemas/ScanTriggerMode"
        cron: { type: string }
        max_concurrent_scans:
          type: integer
          minimum: 1
          default: 1
        history_limit:
          type: integer
          minimum: 1
          default: 500
        max_findings:
          type: integer
          minimum: 1
          default: 200
    KubernetesConnectionUpsertRequest:
      type: object
      properties:
        connector_id:
          type: string
        display_name:
          type: string
        context:
          type: string
    KubernetesPermissionCheck:
      type: object
      properties:
        verb:
          type: string
        resource:
          type: string
        scope:
          type: string
        allowed:
          type: boolean
        diagnostic:
          type: string
        remediation:
          type: string
    KubernetesPreflightDiagnostic:
      type: object
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [warning, error]
        message:
          type: string
        remediation:
          type: string
    KubernetesConnectionStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [kubernetes]
        connected:
          type: boolean
        connector_id:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [pending, active, degraded, disconnected]
        health_status:
