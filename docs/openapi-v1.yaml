  /v1/workspaces/{workspace_id}/projects/{project_id}/aws/runtime-events:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
      - in: path
        name: workspace_id
        required: true
        schema: { type: string }
      - in: path
        name: project_id
        required: true
        schema: { type: string }
    get:
      tags: [ProjectManagement]
      summary: Get AWS runtime event contract
      operationId: getAWSProjectRuntimeEvents
      description: Returns scoped, metadata-only AWS runtime events and access signals for API calls, STS sessions, secret reads, KMS decrypts, S3 access, agent tool calls, IAM last-used data, and Access Analyzer findings. The response links actor identity, session, target resource, event source, timestamp, confidence, evidence, analyzer scope, and signal stale-data timestamps without reading or returning secret values, object bodies, prompts, completions, browser pages, code-interpreter output, database rows, or customer payloads.
      parameters:
        - in: query
          name: connector_id
          schema: { type: string }
          description: Optional AWS connector ID used to scope the account, region, and read-only runtime evidence.
        - in: query
          name: delivery_source
          schema:
            type: string
            enum: [lookup_events, s3, eventbridge, all]
          description: Optional CloudTrail delivery channel selector. Default `lookup_events` keeps the existing LookupEvents-API path; `s3` reads from the trail's S3 log destination; `eventbridge` consumes the EventBridge target SQS queue; `all` fans out across every wired channel and dedupes by EventID.
        - in: query
          name: fixture_state
          schema:
            type: string
            enum: [success, empty, degraded, partial_failure, permission_denied]
          description: Optional deterministic fixture state for UI validation and contract tests.
        - in: query
          name: account_id
          schema: { type: string }
        - in: query
          name: region
          schema: { type: string }
        - in: query
          name: event_type
          schema:
            type: string
            enum: [sts-session, api-call, secret-read, kms-decrypt, agent-tool, iam-last-used, access-analyzer]
        - in: query
          name: identity
          schema: { type: string }
          description: Optional actor principal, role, session, or identity-node search.
        - in: query
          name: agent_id
          schema: { type: string }
          description: Optional agent ID or agent-node search.
        - in: query
          name: resource
          schema: { type: string }
          description: Optional target resource ARN, name, type, or node search.
        - in: query
          name: evidence
          schema:
            type: string
            enum: [cloudtrail, s3-delivery, eventbridge-delivery, agent-runtime, iam-last-used, access-analyzer]
        - in: query
          name: owner
          schema:
            type: string
            enum: [security, platform, application]
        - in: query
          name: status
          schema:
            type: string
            enum: [observed, delayed, permission-denied, resolved, archived, stale, unknown]
      responses:
        "200":
          description: AWS runtime event contract
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    $ref: "#/components/schemas/AWSRuntimeEventResult"
        "400":
          description: Invalid AWS runtime event request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/workspaces/{workspace_id}/projects/{project_id}/aws/secrets-kms-runtime-access:
    parameters:
