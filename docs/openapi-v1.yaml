  /v1/workspaces/{workspace_id}:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
    get:
      tags: [Tenancy]
      summary: Get workspace
      operationId: getWorkspace
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workspace detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tenancy]
      summary: Soft-delete workspace
      description: |
        Owner-only. Flips the workspace into the `deleted` state with a
        30-day reversible grace window and returns the scheduled hard-delete
        deadline. Refuses with `409 sole_owner_requires_transfer` when the
        caller is the only active owner and other active members remain.
      operationId: deleteWorkspace
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workspace marked for deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDeletionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sole-owner guard refused the destructive action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSoleOwnerConflict"
  /v1/workspaces/{workspace_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
    post:
      tags: [Tenancy]
      summary: Suspend workspace
      description: |
        Owner-only. Flips the workspace into `suspended`; scheduled scans
        and connector lifecycle transitions pause. Same sole-owner guard
        semantics as delete. Refuses with `409 not_suspendable` when the
        workspace is already pending deletion — cancel-deletion must run
        first so the grace-expiry check stays authoritative.
      operationId: suspendWorkspace
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workspace suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceLifecycleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Either the sole-owner guard refused the destructive action,
            or the workspace is pending deletion (`code: not_suspendable`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WorkspaceSoleOwnerConflict"
                  - type: object
                    properties:
                      error: { type: string }
                      code: { type: string, enum: [not_suspendable] }
  /v1/workspaces/{workspace_id}/reactivate:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
    post:
      tags: [Tenancy]
      summary: Reactivate workspace
      description: |
        Owner-only. Reverses a suspend; clears `suspended_at`. Refuses
        with `409 not_reactivatable` when the workspace is in the
        `deleted` state — restoration must go through `cancel-deletion`
        so the 30-day grace window stays authoritative.
      operationId: reactivateWorkspace
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workspace reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceLifecycleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Workspace is not suspended (e.g. it is deleted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [not_reactivatable] }
  /v1/workspaces/{workspace_id}/cancel-deletion:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
    post:
      tags: [Tenancy]
      summary: Cancel workspace deletion
      description: |
        Owner-only. Reverses a soft delete within the 30-day grace window.
        Returns `409 deletion_not_pending` when the workspace is not in
        the soft-deleted state (no deletion to cancel). Returns
        `410 grace_period_expired` once the worker is authoritative for
        the purge.
      operationId: cancelWorkspaceDeletion
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workspace deletion cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceLifecycleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Workspace is not pending deletion (e.g. it is active or
            already suspended). The cancel-deletion path is reserved
            for soft-deleted workspaces inside the grace window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [deletion_not_pending] }
        "410":
          description: Grace period has expired; worker is authoritative
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [grace_period_expired] }
