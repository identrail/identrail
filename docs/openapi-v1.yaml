          name: fixture_state
          schema:
            type: string
            enum: [success, empty, degraded, partial_failure, permission_denied]
        - in: query
          name: account_id
          schema: { type: string }
        - in: query
          name: region
          schema: { type: string }
        - in: query
          name: cohort
          schema: { type: string }
        - in: query
          name: feature_flag
          schema: { type: boolean }
        - in: query
          name: kill_switch
          schema: { type: boolean }
        - in: query
          name: canary_percent
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - in: query
          name: operator_override
          schema:
            type: string
            enum: [hold, pause, resume]
          description: Operator override control. `hold`/`pause` holds every pilot decision until explicitly resumed; unknown values are rejected.
