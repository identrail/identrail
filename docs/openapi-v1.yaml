paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusResponse"
  /readyz:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: readinessCheck
      security: []
      responses:
        "200":
          description: Service ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusResponse"
        "503":
          description: Service not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusResponse"
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics endpoint
      operationId: metrics
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
  /v1/enterprise/identity-connections/saml:
    get:
      tags: [EnterpriseAuth]
      summary: List native SAML identity connections
      operationId: listNativeSAMLConnections
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Native SAML connections for the current organization
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/NativeSAMLConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [EnterpriseAuth]
      summary: Create a native SAML identity connection
      operationId: createNativeSAMLConnection
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeSAMLConnectionRequest"
      responses:
        "201":
          description: Native SAML connection created with a one-time SCIM bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeSAMLConnectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/enterprise/identity-connections/saml/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [EnterpriseAuth]
      summary: Get a native SAML identity connection
      operationId: getNativeSAMLConnection
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Native SAML connection
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection:
                    $ref: "#/components/schemas/NativeSAMLConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [EnterpriseAuth]
      summary: Update a native SAML identity connection
      operationId: updateNativeSAMLConnection
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeSAMLConnectionUpdateRequest"
      responses:
        "200":
          description: Native SAML connection updated
          content:
            application/json:
              schema:
                type: object
                required: [connection]
                properties:
                  connection:
                    $ref: "#/components/schemas/NativeSAMLConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [EnterpriseAuth]
      summary: Delete a native SAML identity connection
      operationId: deleteNativeSAMLConnection
      security:
        - CookieAuth: []
      responses:
        "204":
          description: Native SAML connection deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/enterprise/identity-connections/saml/from-metadata:
    post:
      tags: [EnterpriseAuth]
      summary: Import native SAML settings from IdP metadata
      operationId: importNativeSAMLConnectionMetadata
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [metadata_url]
                - required: [metadata_xml]
              properties:
                metadata_url:
                  type: string
                  format: uri
                  description: HTTPS IdP metadata URL.
                metadata_xml:
                  type: string
                  description: Inline IdP metadata XML.
      responses:
        "200":
          description: Parsed SAML metadata draft
          content:
            application/json:
              schema:
                type: object
                required: [entity_id, sso_url, certificate_pem]
                properties:
                  entity_id:
                    type: string
                  sso_url:
                    type: string
                    format: uri
                  certificate_pem:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /scim/v2/ServiceProviderConfig:
    get:
      tags: [SCIM]
      summary: SCIM service-provider configuration
      operationId: getSCIMServiceProviderConfig
      security:
        - SCIMBearerAuth: []
      responses:
        "200":
          description: SCIM service capabilities
          content:
            application/scim+json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/SCIMError"
  /scim/v2/Schemas:
    get:
      tags: [SCIM]
      summary: SCIM schemas
      operationId: getSCIMSchemas
      security:
        - SCIMBearerAuth: []
      responses:
        "200":
          description: SCIM schema list response
          content:
            application/scim+json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/SCIMError"
  /scim/v2/ResourceTypes:
    get:
      tags: [SCIM]
      summary: SCIM resource types
      operationId: getSCIMResourceTypes
      security:
        - SCIMBearerAuth: []
      responses:
        "200":
          description: SCIM resource-type list response
          content:
            application/scim+json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/SCIMError"
  /scim/v2/Users:
    get:
      tags: [SCIM]
      summary: List SCIM users
      operationId: listSCIMUsers
      security:
        - SCIMBearerAuth: []
      parameters:
        - in: query
          name: filter
          required: false
          schema: { type: string }
          description: Supports `userName eq "value"`.
        - in: query
          name: startIndex
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: count
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: SCIM user list
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SCIMUserListResponse"
        "400":
          $ref: "#/components/responses/SCIMError"
        "401":
          $ref: "#/components/responses/SCIMError"
    post:
      tags: [SCIM]
      summary: Create a SCIM user
      operationId: createSCIMUser
      security:
        - SCIMBearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/SCIMUser"
      responses:
        "201":
          description: Created SCIM user
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SCIMUser"
        "400":
          $ref: "#/components/responses/SCIMError"
        "401":
          $ref: "#/components/responses/SCIMError"
        "409":
          $ref: "#/components/responses/SCIMError"
  /scim/v2/Users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [SCIM]
      summary: Get a SCIM user
      operationId: getSCIMUser
      security:
        - SCIMBearerAuth: []
      responses:
        "200":
          description: SCIM user
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SCIMUser"
        "401":
          $ref: "#/components/responses/SCIMError"
        "404":
          $ref: "#/components/responses/SCIMError"
    put:
      tags: [SCIM]
      summary: Replace a SCIM user
      operationId: putSCIMUser
      security:
        - SCIMBearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/SCIMUser"
      responses:
        "200":
          description: Updated SCIM user
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SCIMUser"
        "400":
          $ref: "#/components/responses/SCIMError"
        "401":
          $ref: "#/components/responses/SCIMError"
        "404":
          $ref: "#/components/responses/SCIMError"
    patch:
      tags: [SCIM]
      summary: Patch a SCIM user
      operationId: patchSCIMUser
      security:
        - SCIMBearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/SCIMPatchRequest"
      responses:
        "200":
          description: Patched SCIM user
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SCIMUser"
        "400":
          $ref: "#/components/responses/SCIMError"
        "401":
          $ref: "#/components/responses/SCIMError"
        "404":
          $ref: "#/components/responses/SCIMError"
    delete:
      tags: [SCIM]
      summary: Deactivate a SCIM user
      operationId: deleteSCIMUser
      security:
        - SCIMBearerAuth: []
      responses:
        "204":
          description: SCIM user deactivated
        "401":
          $ref: "#/components/responses/SCIMError"
        "404":
          $ref: "#/components/responses/SCIMError"
  /auth/logout:
    post:
      tags: [Authorization]
      summary: Log out the current session
      operationId: logoutCurrentSession
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Current session revoked and cookie cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    get:
      tags: [Authorization]
      summary: Start WorkOS AuthKit sign-in
      operationId: startWorkOSLogin
      security: []
      parameters:
        - in: query
          name: return_to
          required: false
          schema:
            type: string
        - in: query
          name: provider
          required: false
          description: Optional hosted provider selector. Defaults to AuthKit when omitted.
          schema:
            type: string
            enum: [authkit, google_oauth, github_oauth]
      responses:
        "302":
          description: Redirect to WorkOS AuthKit
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/signup:
    get:
      tags: [Authorization]
      summary: Start WorkOS AuthKit sign-up
      operationId: startWorkOSSignup
      security: []
      parameters:
        - in: query
          name: return_to
          required: false
          schema:
            type: string
        - in: query
          name: provider
          required: false
          description: Optional hosted provider selector. Defaults to AuthKit when omitted.
          schema:
            type: string
            enum: [authkit, google_oauth, github_oauth]
      responses:
        "302":
          description: Redirect to WorkOS AuthKit sign-up screen
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/manual:
    post:
      tags: [Authorization]
      summary: Create a dev/self-host manual session
      operationId: createManualAuthSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, workspace_id]
              properties:
                tenant_id:
                  type: string
                workspace_id:
                  type: string
                project_id:
                  type: string
                email:
                  type: string
                  format: email
                display_name:
                  type: string
      responses:
        "200":
          description: Session cookie set for manual mode
          content:
            application/json:
              schema:
                type: object
                required: [ok, redirect_to]
                properties:
                  ok:
                    type: boolean
                  redirect_to:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Manual mode is disabled for this deployment
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/callback:
    get:
      tags: [Authorization]
      summary: Complete WorkOS AuthKit callback
      operationId: completeWorkOSCallback
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        "302":
          description: >
            Session cookie set and browser redirected to the app, or browser
            redirected back to sign-in with a user-facing reason.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/saml/login/{connection_id}:
    get:
      tags: [Authorization]
      summary: Begin native SAML SP-initiated login
      operationId: beginNativeSAMLLogin
      security: []
      parameters:
        - in: path
          name: connection_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: return_to
          schema:
            type: string
      responses:
        "302":
          description: Browser redirected to the IdP SSO URL with RelayState
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/saml/acs/{connection_id}:
    post:
      tags: [Authorization]
      summary: Receive a SAML 2.0 assertion at the Assertion Consumer Service
      operationId: receiveNativeSAMLAssertion
      security: []
      parameters:
        - in: path
          name: connection_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse:
                  type: string
                  description: Base64-encoded SAML 2.0 Response document
                RelayState:
                  type: string
                  description: Opaque state token issued by /auth/saml/login
      responses:
        "302":
          description: Session cookie set and browser redirected to the app
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/webhooks/workos:
    post:
      tags: [Authorization]
      summary: Receive WorkOS AuthKit lifecycle webhooks
      operationId: receiveWorkOSWebhook
      security:
        - WorkOSWebhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /webhooks/github:
    post:
      tags: [RepositoryExposure]
      summary: Receive GitHub webhook events for repository scan triggers
      operationId: receiveGitHubWebhook
      security:
        - GitHubWebhookSignature: []
      parameters:
        - in: header
          name: X-GitHub-Event
          required: true
          schema: { type: string }
        - in: header
          name: X-GitHub-Delivery
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Webhook accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    $ref: "#/components/schemas/GitHubWebhookResult"
        "400":
          description: Invalid webhook payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid webhook signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/enterprise/reports/executive:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
      - $ref: "#/components/parameters/executiveReportDomain"
    get:
      tags: [EnterpriseAuth]
      summary: Executive security report for the current organization
      description: >-
        Returns a deterministic leadership rollup (open volume by severity,
        top finding types, week-over-week trend, and mean time to resolve)
        built from the current organization's findings. Responses are cached
        per organization for 60 seconds. JSON only; no server-side PDF.
      operationId: getExecutiveReport
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Executive report for the current organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutiveReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
