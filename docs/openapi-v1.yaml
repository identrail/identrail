  /v1/me/deactivate:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
    post:
      tags: [Authorization]
      summary: Suspend the current user account
      description: |
        Transitions the authenticated user from `active` to `deactivated`,
