  /v1/me:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
    get:
      tags: [Authorization]
      summary: Get current session user
      operationId: getCurrentUser
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Current user and session context
          content:
            application/json:
              schema:
                type: object
                properties:
                  me:
                    $ref: "#/components/schemas/CurrentUserContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Authorization]
      summary: Update current user profile
      operationId: updateCurrentUserProfile
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentUserProfileUpdateRequest"
      responses:
        "200":
          description: Updated current user and session context
          content:
            application/json:
              schema:
                type: object
                properties:
                  me:
                    $ref: "#/components/schemas/CurrentUserContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Authorization]
      summary: Schedule the current user account for permanent deletion
      description: |
        Soft-deletes the authenticated user account: transitions status to
        `deleted`, stamps `deleted_at`, revokes every other active session,
        soft-deletes the row, and schedules a hard-delete worker pass 30 days
        out. The calling session is intentionally preserved as the recovery
        cookie — every other route refuses it (status is no longer `active`)
        but `POST /v1/me/cancel-deletion` accepts it through a lenient
        session lookup so the user can reverse the deletion from the same
        browser without needing to re-authenticate. Idempotent — a repeat
        call against an already-deleted account returns the
        originally-scheduled `hard_delete_after` timestamp.

        Returns 409 with code `sole_owner` and the affected workspaces when
        the account is the sole owner of one or more workspaces, so ownership
        must be transferred before deletion can proceed.
      operationId: deleteCurrentUser
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Account scheduled for permanent deletion
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [deleted]
                  deleted_at:
                    type: string
                    format: date-time
                  hard_delete_after:
                    type: string
                    format: date-time
                  grace_period_hours:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Account is sole owner of one or more workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [sole_owner]
                  workspaces:
                    type: array
                    items:
                      type: object
                      properties:
                        tenant_id:
                          type: string
                        workspace_id:
                          type: string
                        display_name:
                          type: string
                        slug:
                          type: string
  /v1/me/cancel-deletion:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
    post:
      tags: [Authorization]
      summary: Cancel a pending account deletion
      description: |
        Reverses a pending soft-delete during the 30-day grace window:
        transitions status back to `active` and clears `deleted_at`. Requires
        a signed-in session; the typical flow for a signed-out deleted user is
        to re-authenticate through the WorkOS `cancel_deletion` intent.
        Returns 410 once the grace window has elapsed.
      operationId: cancelCurrentUserDeletion
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Deletion cancelled, account reactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [active]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Grace period has expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [grace_period_expired]
  /v1/me/export:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
    post:
      tags: [Authorization]
      summary: Enqueue a "Download my data" export job
      description: |
        Starts an export of the caller's account record, workspace
        memberships, audit-relevant events, and session history. Returns
        the queued job; the user then polls `GET /v1/me/export/{job_id}`
        until `status` becomes `ready`, at which point a 24-hour signed
        download URL is included on the response.
      operationId: enqueueCurrentUserDataExport
      security:
        - CookieAuth: []
      responses:
        "202":
          description: Export job accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataExportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Rate limit exceeded because too many export requests were created recently
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [rate_limited] }
        "503":
          description: Data export is not configured for this deployment
    get:
      tags: [Authorization]
      summary: List recent "Download my data" export jobs
      operationId: listCurrentUserDataExports
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Recent export jobs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserDataExportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Data export persistence is unavailable
  /v1/me/export/{job_id}:
    parameters:
      - $ref: "#/components/parameters/scopeTenantID"
      - $ref: "#/components/parameters/scopeWorkspaceID"
      - in: path
        name: job_id
        required: true
        schema: { type: string }
    get:
      tags: [Authorization]
      summary: Poll the status of a "Download my data" export
      description: |
        Returns the current state of one export owned by the caller. When
        `status` is `ready`, the response includes a signed `download_url`
        valid until `download_expires_at`.
      operationId: getCurrentUserDataExport
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataExportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Data export is not configured for this deployment
  /v1/me/export/{job_id}/download:
    parameters:
      - in: path
        name: job_id
        required: true
        schema: { type: string }
      - in: query
        name: token
        required: true
        schema: { type: string }
    get:
      tags: [Authorization]
      summary: Download a ready "Download my data" ZIP bundle
      description: |
        Streams the completed account data export ZIP for a ready job. This
        route is authorized by the 24-hour signed `token` query parameter
        returned from `GET /v1/me/export/{job_id}`, so it does not require a
        session cookie.
      operationId: downloadCurrentUserDataExport
      security: []
      responses:
        "200":
          description: ZIP archive containing the user's account export
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Bundle-SHA256:
              schema: { type: string }
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: Export not found, token invalid, or download link expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        "410":
          description: Export bundle has been purged
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        "503":
          description: Data export is not configured for this deployment
